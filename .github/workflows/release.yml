name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Without vendor/ (BladeOne) the blocks register but render nothing on the
      # front end; vendor/ is gitignored, so it has to be installed here.
      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      # Everything the plugin runs on goes into the zip; only development files are
      # left out. An explicit list of folders once forgot src/ (OverchainBlocks\View),
      # and every Blade block rendered nothing after an update.
      - name: Assemble plugin folder
        run: |
          mkdir -p build-zip
          rsync -a ./ build-zip/overchain-blocks/ --exclude-from=.github/release-exclude.txt

      # Fail the release instead of shipping a package that would blank the sites.
      - name: Verify package
        run: bash .github/verify-package.sh build-zip/overchain-blocks

      - name: Build plugin zip
        run: |
          cd build-zip
          zip -r ../overchain-blocks.zip overchain-blocks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: overchain-blocks.zip
          generate_release_notes: true
